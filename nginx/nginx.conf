# ═══════════════════════════════════════════════════════════════
# AfriFundedCapital — Nginx Reverse Proxy
# ═══════════════════════════════════════════════════════════════
#
# Features:
#   • Reverse proxy to Bun app
#   • Gzip compression
#   • Static asset caching (1 year for hashed assets)
#   • SSL/TLS termination (with self-signed or real certs)
#   • Security headers (HSTS, CSP, X-Frame, etc.)
#   • Rate limiting on auth endpoints
#   • Request size limits
#   • WebSocket-ready
#   • Health check endpoint
#
# ═══════════════════════════════════════════════════════════════

# ─── Rate Limiting Zones ────────────────────────────────────
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=60r/s;

# ─── Upstream ───────────────────────────────────────────────
upstream app_backend {
    server app-prod:5173;
    keepalive 32;
}

# ─── HTTP → HTTPS Redirect + ACME Challenge ────────────────
server {
    listen 80;
    server_name _;

    # Allow health checks over HTTP
    location /health {
        proxy_pass http://app_backend/api/health;
        proxy_set_header Host $host;
    }

    # Let's Encrypt ACME HTTP-01 challenge
    # Certbot places verification tokens in /.well-known/acme-challenge/
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect everything else to HTTPS (when SSL certs exist)
    location / {
        # If SSL certs are mounted, redirect to HTTPS
        # Uncomment the next line after obtaining real SSL certificates
        # return 301 https://$host$request_uri;

        # Fallback: proxy directly if no SSL certs
        proxy_pass http://app_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ─── HTTPS Server ───────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name _;

    # ── SSL Configuration ──────────────────────────────────
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;

    # ── Security Headers ───────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Request Limits ─────────────────────────────────────
    client_max_body_size 10M;
    client_body_timeout 30s;
    client_header_timeout 30s;
    keepalive_timeout 65s;

    # ── Gzip Compression ───────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon;

    # ── Brotli (if module available) ───────────────────────
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/json application/javascript text/xml image/svg+xml;

    # ── Static Assets (hashed filenames — long cache) ──────
    location /assets/ {
        proxy_pass http://app_backend;
        proxy_set_header Host $host;

        # Cache hashed assets for 1 year
        expires 365d;
        add_header Cache-Control "public, immutable, max-age=31536000";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── Font files ─────────────────────────────────────────
    location ~* \.(woff|woff2|ttf|otf|eot)$ {
        proxy_pass http://app_backend;
        proxy_set_header Host $host;

        expires 365d;
        add_header Cache-Control "public, immutable, max-age=31536000";
        add_header Access-Control-Allow-Origin "*";
    }

    # ── Image files ────────────────────────────────────────
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|avif)$ {
        proxy_pass http://app_backend;
        proxy_set_header Host $host;

        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ── Auth endpoints (strict rate limiting) ──────────────
    location /api/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://app_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Don't cache auth responses
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        proxy_hide_header Set-Cookie;
        add_header Set-Cookie $upstream_http_set_cookie always;
    }

    # ── API endpoints (moderate rate limiting) ─────────────
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        limit_req_status 429;

        proxy_pass http://app_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Don't cache API responses by default
        add_header Cache-Control "no-store" always;
        proxy_hide_header Set-Cookie;
        add_header Set-Cookie $upstream_http_set_cookie always;
    }

    # ── Health check (no rate limit) ───────────────────────
    location /health {
        proxy_pass http://app_backend/api/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── Webhook endpoints (no rate limit, POST only) ───────
    location /api/webhooks/ {
        proxy_pass http://app_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Webhook-Signature $http_x_webhook_signature;

        # Log webhooks for debugging
        access_log /var/log/nginx/webhooks.log combined;
    }

    # ── SPA Fallback (all other routes) ────────────────────
    location / {
        limit_req zone=general_limit burst=100 nodelay;

        proxy_pass http://app_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # HTML pages — short cache
        add_header Cache-Control "no-cache, must-revalidate" always;

        # WebSocket support (for future use)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── Custom Error Pages ─────────────────────────────────
    error_page 429 /429.json;
    location = /429.json {
        internal;
        default_type application/json;
        return 429 '{"error":"Too many requests. Please try again later.","retryAfter":5}';
    }

    error_page 502 /502.json;
    location = /502.json {
        internal;
        default_type application/json;
        return 502 '{"error":"Service temporarily unavailable. Please try again."}';
    }

    error_page 503 /503.json;
    location = /503.json {
        internal;
        default_type application/json;
        return 503 '{"error":"Service maintenance in progress. Please try again later."}';
    }

    # ── Deny hidden files ──────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
