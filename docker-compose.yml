# ═══════════════════════════════════════════════════════════════
# AfriFundedCapital — Docker Compose
# ═══════════════════════════════════════════════════════════════
#
# Usage:
#   Development:  docker compose --profile dev up
#   Production:   docker compose --profile prod up --build
#   With Nginx:   docker compose --profile prod --profile nginx up --build
#   With SSL:     docker compose --profile prod --profile nginx up --build
#
# ═══════════════════════════════════════════════════════════════

services:
  # ─── Development (hot-reload) ─────────────────────────────
  app-dev:
    profiles: ["dev"]
    image: oven/bun:1
    container_name: afc-dev
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - bun-cache:/root/.bun/install/cache
    environment:
      - NODE_ENV=development
      - FLW_PUBLIC_KEY=${FLW_PUBLIC_KEY:-}
      - FLW_SECRET_KEY=${FLW_SECRET_KEY:-}
      - FLW_SECRET_HASH=${FLW_SECRET_HASH:-}
      - FLW_ENCRYPTION_KEY=${FLW_ENCRYPTION_KEY:-}
      - PAYSTACK_SECRET_KEY=${PAYSTACK_SECRET_KEY:-}
      - PAYSTACK_PUBLIC_KEY=${PAYSTACK_PUBLIC_KEY:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
    command: sh -c "bun install && bun run dev --host 0.0.0.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ─── Production (pre-built) ───────────────────────────────
  app-prod:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: afc-prod
    expose:
      - "5173"
    volumes:
      - afc-data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=5173
      - DB_PATH=/app/data/afrifundedcapital.db
      - FLW_PUBLIC_KEY=${FLW_PUBLIC_KEY:-}
      - FLW_SECRET_KEY=${FLW_SECRET_KEY:-}
      - FLW_SECRET_HASH=${FLW_SECRET_HASH:-}
      - FLW_ENCRYPTION_KEY=${FLW_ENCRYPTION_KEY:-}
      - PAYSTACK_SECRET_KEY=${PAYSTACK_SECRET_KEY:-}
      - PAYSTACK_PUBLIC_KEY=${PAYSTACK_PUBLIC_KEY:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - CORS_ORIGINS=http://localhost,https://localhost,http://localhost:8080
    restart: unless-stopped
    networks:
      - afc-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ─── Nginx Reverse Proxy ──────────────────────────────────
  nginx:
    profiles: ["nginx"]
    image: nginx:alpine
    container_name: afc-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx-cache:/var/cache/nginx
      - nginx-logs:/var/log/nginx
      - certbot-www:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    depends_on:
      app-prod:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - afc-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ─── Certbot (Let's Encrypt Auto-Renewal) ────────────────
  certbot:
    profiles: ["nginx"]
    build:
      context: .
      dockerfile: nginx/certbot/Dockerfile
    container_name: afc-certbot
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
      - certbot-logs:/var/log/letsencrypt
    depends_on:
      nginx:
        condition: service_started
    restart: unless-stopped
    networks:
      - afc-network
    # Keep container alive for cron-based renewal
    entrypoint: ["/bin/sh", "-c", "while true; do sleep 12h; done"]

networks:
  afc-network:
    driver: bridge

volumes:
  bun-cache:
    driver: local
  afc-data:
    driver: local
  nginx-cache:
    driver: local
  nginx-logs:
    driver: local
  certbot-www:
    driver: local
  certbot-certs:
    driver: local
  certbot-logs:
    driver: local
