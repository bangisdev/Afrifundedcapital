# gitleaks configuration for AfriFundedCapital
# Blocks commits containing secrets before they reach GitHub.
# Extends gitleaks' built-in rule set with the patterns this project uses.
#
# Kept in sync with scripts/check-secrets.sh — the deterministic working-tree
# gate run as `bun run check:secrets` (secrets-scan job in the e2e workflows).
# Alignment contract:
#   - Same value thresholds for Flutterwave (FLWSECK-* incl. FLWSECK_TEST-*),
#     Resend (re_ + 24 chars) and Paystack/Stripe (sk_*) secrets; same
#     hardcoded env-var assignment names (incl. JWT_PRIVATE_KEY,
#     SMTP_PASS / SMTP_PASSWORD, FLW_SECRET_HASH) and MT5 `apiKey` fields;
#     same private-key PEM block shape.
#   - Custom rules that would collide with default rule ids are renamed with
#     the `afc-` prefix (e.g. afc-flutterwave-secret-key): with [extend], a
#     colliding id merges this config INTO the default rule, keeping the
#     default's keywords/entropy/allowlists, which silently suppresses
#     matches. Unique ids + explicit `keywords` keep our patterns effective.
#   - Same exclusions: node_modules, dist, .vite, .e2e, __tests__ (intentional
#     mock credentials), lockfiles, test-results, playwright-report.
#   - gitleaks is deliberately the *superset*: it additionally flags public
#     keys (FLWPUBK-*, pk_live_*) and generic api/secret-key assignments that
#     check-secrets intentionally ignores (public keys aren't secrets; broad
#     name-based rules risk false positives in the deterministic CI gate).
# When adding a pattern here, mirror it in scripts/check-secrets.sh (and vice
# versa), then update the README Security section.

title = "AfriFundedCapital gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "resend-api-key"
description = "Resend API key (re_ + 24 chars) — the key that was previously exposed"
regex = '''re_[a-zA-Z0-9]{24,}'''
secretGroup = 0
entropy = 3.0

[[rules]]
id = "afc-flutterwave-secret-key"
description = "AfriFundedCapital: Flutterwave secret key (FLWSECK-... or FLWSECK_TEST-...) — mirrors check-secrets.sh pattern 1"
regex = '''FLWSECK[-_](TEST[-_])?[a-zA-Z0-9]{8,}'''
secretGroup = 0
keywords = ["flwseck", "flwseck_test"]

[[rules]]
id = "afc-flutterwave-public-key"
description = "AfriFundedCapital: Flutterwave public key (FLWPUBK... or FLWPUBK_TEST...) — public, kept for completeness"
regex = '''FLWPUBK[-_](TEST[-_])?[a-zA-Z0-9]{10,}'''
secretGroup = 0
keywords = ["flwpubk", "flwpubk_test"]

[[rules]]
id = "stripe-live-secret"
description = "Stripe live secret key (also caught by paystack-secret)"
regex = '''sk_live_[a-zA-Z0-9]{16,}'''
secretGroup = 0

[[rules]]
id = "stripe-live-public"
description = "Stripe live public key"
regex = '''pk_live_[a-zA-Z0-9]{16,}'''
secretGroup = 0

[[rules]]
id = "paystack-secret"
description = "Paystack secret key (sk_...) used for server-side calls"
regex = '''(?i)sk_(test|live)_[a-zA-Z0-9]{16,}'''
secretGroup = 0

[[rules]]
id = "env-secret-assignment"
description = "Hardcoded gateway/JWT/SMTP env-var assignments — mirrors check-secrets.sh pattern 3 (.env, YAML and JSON quoting forms)"
regex = '''(?i)["']?(FLW_SECRET_KEY|FLW_SECRET_HASH|RESEND_API_KEY|PAYSTACK_SECRET_KEY|JWT_PRIVATE_KEY|SMTP_PASS|SMTP_PASSWORD|MT5_API_KEY|MT5_GATEWAY_API_KEY)["']?\s*[=:]\s*["']?[a-zA-Z0-9_][^\s"']{7,}'''
secretGroup = 0

[[rules]]
id = "afc-generic-api-key"
description = "AfriFundedCapital: generic api/secret-key assignment incl. JSON quoted-name form — mirrors check-secrets.sh pattern 4"
regex = '''(?i)["']?(api[_-]?key|secret[_-]?key)["']?\s*[=:]\s*["']?([a-zA-Z0-9+/=_\-]{16,})'''
secretGroup = 2
entropy = 3.0
keywords = ["apikey", "api_key", "api-key", "secretkey", "secret_key", "secret-key", "api", "key", "secret"]

[[rules]]
id = "private-key-block"
description = "Private key block (mirrors check-secrets.sh pattern 5)"
regex = '''-----BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----'''
secretGroup = 0

[allowlist]
description = "Files that are allowed to contain matching patterns (kept in sync with check-secrets.sh exclusions)"
paths = [
  '''node_modules/''',
  '''dist/''',
  '''\.vite/''',
  '''\.e2e/''',
  '''__tests__/''',
  '''bun\.lock''',
  '''package-lock\.json''',
  '''yarn\.lock''',
  '''pnpm-lock\.yaml''',
  '''test-results/''',
  '''playwright-report/''',
]
