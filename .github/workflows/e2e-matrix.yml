name: E2E Matrix (per-section chunks)

on:
  pull_request:
    branches: [main]
  # Allow manual triggering (e.g. to re-run a full sweep without a PR)
  workflow_dispatch:

# Cancel in-progress runs for the same PR/ref — a fresh push supersedes the
# whole matrix sweep.
concurrency:
  group: e2e-matrix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # Heavy chunks (mt5, scheduler, audit) appear twice — once per shard — so
    # the name includes "· n/N" to tell them apart.
    name: E2E · ${{ matrix.chunk }}${{ matrix.shard_total > 1 && format(' · {0}/{1}', matrix.shard, matrix.shard_total) || '' }}
    runs-on: ubuntu-latest
    # Each job gets its own wall-clock budget, tuned to its chunk/shard size
    # (install + boot + tests). A chunk that exceeds its budget is hung, not
    # merely slow.
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      # A failure in one chunk/shard must not cancel the others — each section
      # reports independently.
      fail-fast: false
      matrix:
        include:
          # Lighter sections (few tests, quick pages) — 1 shard each
          - chunk: auth
            timeout: 10
            shard: 1
            shard_total: 1
          - chunk: overview
            timeout: 10
            shard: 1
            shard_total: 1
          - chunk: nav
            timeout: 10
            shard: 1
            shard_total: 1
          - chunk: responsive
            timeout: 10
            shard: 1
            shard_total: 1
          - chunk: settings
            timeout: 10
            shard: 1
            shard_total: 1
          # Medium sections (management CRUD + tables) — 1 shard each
          - chunk: users
            timeout: 12
            shard: 1
            shard_total: 1
          - chunk: challenges
            timeout: 12
            shard: 1
            shard_total: 1
          - chunk: payments
            timeout: 12
            shard: 1
            shard_total: 1
          - chunk: trading
            timeout: 12
            shard: 1
            shard_total: 1
          # Heavy sections — sharded x 2 so each half runs on its own runner.
          # Playwright's --shard splits per test because the config sets
          # fullyParallel: true (per-file sharding would silently skip shards
          # on this single-spec suite); grep narrows to the section first.
          - chunk: mt5
            timeout: 15
            shard: 1
            shard_total: 2
          - chunk: mt5
            timeout: 15
            shard: 2
            shard_total: 2
          - chunk: scheduler
            timeout: 15
            shard: 1
            shard_total: 2
          - chunk: scheduler
            timeout: 15
            shard: 2
            shard_total: 2
          - chunk: audit
            timeout: 15
            shard: 1
            shard_total: 2
          - chunk: audit
            timeout: 15
            shard: 2
            shard_total: 2
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # All jobs run in parallel and every one would otherwise re-download
      # Chromium (~150 MB each). Cache the shared browser install keyed on the
      # lockfile so version bumps invalidate it automatically.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Each job runs its chunk/shard via the package.json preset plus
      # --shard=n/N (1/1 is a no-op for the non-sharded chunks). Playwright
      # boots its own `bun run dev` with E2E_TESTING=1 (the port is free on
      # the isolated runner) and tears it down after — no cross-job port or
      # data contention because every job gets a fresh runner + SQLite file.
      - name: Run E2E chunk — ${{ matrix.chunk }} (shard ${{ matrix.shard }}/${{ matrix.shard_total }})
        run: bun run test:e2e:${{ matrix.chunk }} -- --shard=${{ matrix.shard }}/${{ matrix.shard_total }}
        env:
          CI: true
          E2E_ADMIN_EMAIL: admin@afrifundedcapital.com
          E2E_ADMIN_PASSWORD: Admin@123456

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.chunk }}-shard${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.chunk }}-shard${{ matrix.shard }}
          path: test-results/
          retention-days: 7

      - name: Upload trace files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-${{ matrix.chunk }}-shard${{ matrix.shard }}
          path: test-results/**/trace.zip
          retention-days: 7

  # ─── Secrets guard ───────────────────────────────────────────────────────
  # Same gate as e2e.yml: fail the workflow if real gateway secrets are
  # committed (Flutterwave FLWSECK-* values, Resend re_* keys, hardcoded
  # FLW_SECRET_KEY / RESEND_API_KEY assignments). Plain bash + grep, no deps.
  secrets-scan:
    name: secrets-scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan for committed gateway secrets
        run: bash scripts/check-secrets.sh

      - name: Fixture regression guard (both gates)
        run: bash scripts/gitleaks-fixture.sh

      - name: Gate alignment test (gitleaks ↔ check-secrets)
        run: bash scripts/check-alignment.sh
