# ═══════════════════════════════════════════════════════════════
# AfriFundedCapital — Docker Publish on Release
# ═══════════════════════════════════════════════════════════════
#
# Builds and pushes Docker images when a GitHub Release is created.
#
# Registries:
#   • GHCR (ghcr.io) — GitHub Container Registry (free for public repos)
#   • Docker Hub — optional, requires DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets
#
# Triggers:
#   • GitHub Release published (any tag: v1.0.0, v2.3.1-rc1, etc.)
#   • Manual dispatch for testing
#
# Features:
#   • Multi-platform: linux/amd64, linux/arm64
#   • Semver tagging: v1.2.3 → 1.2.3, 1.2, 1, latest
#   • Trivy security scan
#   • Build caching via GitHub Actions cache
#
# ═══════════════════════════════════════════════════════════════

name: Docker Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v1.0.0)"
        required: false
        default: "latest"

env:
  REGISTRY_GHCR: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─── Build & Push ────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # ── Docker Buildx (multi-platform) ──────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── QEMU for ARM64 emulation ───────────────────────
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # ── Login to GitHub Container Registry ──────────────
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Login to Docker Hub (optional) ──────────────────
      - name: Login to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Extract metadata (tags & labels) ────────────────
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}
            ${{ secrets.DOCKERHUB_USERNAME && format('{0}/{1}', secrets.DOCKERHUB_USERNAME, github.event.repository.name) || '' }}
          tags: |
            # Tag with release version (e.g., v1.2.3 → 1.2.3)
            type=semver,pattern={{version}}
            # Tag with major.minor (e.g., 1.2)
            type=semver,pattern={{major}}.{{minor}}
            # Tag with major (e.g., 1)
            type=semver,pattern={{major}}
            # Tag with "latest" for the most recent stable release
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}
            # Tag with "edge" for pre-releases (e.g., v1.2.3-rc1)
            type=raw,value=edge,enable=${{ contains(github.ref, '-') }}
            # Tag with short SHA for traceability
            type=sha,prefix=sha-,format=short
            # Tag with "nightly" for manual dispatch
            type=raw,value=nightly,enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=AfriFundedCapital
            org.opencontainers.image.description=Enterprise CFD Prop Firm Platform
            org.opencontainers.image.vendor=AfriFundedCapital
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      # ── Build and push ──────────────────────────────────
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: production
          build-args: |
            NODE_ENV=production

      # ── Output image info ──────────────────────────────
      - name: Image info
        run: |
          echo "## Docker Image Published 🐳" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Platforms:** linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** ${{ steps.meta.outputs.digest }}" >> $GITHUB_STEP_SUMMARY

  # ─── Security Scan ──────────────────────────────────────
  security-scan:
    name: Trivy Security Scan
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      # ── Run Trivy vulnerability scanner ─────────────────
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true

      # ── Upload scan results to GitHub Security ──────────
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

      # ── Print critical findings ─────────────────────────
      - name: Trivy scan summary
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: "table"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
        if: always()

  # ─── Deployment Notify ──────────────────────────────────
  notify:
    name: Deployment Summary
    needs: [build-and-push, security-scan]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Deployment summary
        run: |
          echo "## 🚀 Release Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Image Registry" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Registry | Image |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| GHCR | \`${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pull Command" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}:${{ github.event.release.tag_name || 'latest' }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deploy" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "# Download compose files from the release, then:" >> $GITHUB_STEP_SUMMARY
          echo "docker compose --profile prod up -d" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
