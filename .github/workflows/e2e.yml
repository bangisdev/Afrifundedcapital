name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e/${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each chunk is selected with the same --grep pattern as the
          # package.json presets, so local and CI runs are identical.
          #
          # The heaviest chunks (mt5, scheduler, audit) are split across two
          # spec files each and run with --workers=2, so Playwright runs one
          # file per worker and cuts wall-clock time roughly in half.
          - { name: auth,       grep: "1\\. Authentication",                   workers: 1, timeout: 14 }
          - { name: overview,   grep: "2\\. Admin Overview",                   workers: 1, timeout: 14 }
          - { name: users,      grep: "3\\. User Management",                  workers: 1, timeout: 14 }
          - { name: challenges, grep: "4\\. Challenges",                       workers: 1, timeout: 14 }
          - { name: payments,   grep: "5\\. Payments",                         workers: 1, timeout: 14 }
          - { name: nav,        grep: "6\\. Cross-page navigation",            workers: 1, timeout: 14 }
          - { name: responsive, grep: "7\\. Responsive viewports",             workers: 1, timeout: 14 }
          - { name: mt5,        grep: "8\\. MT5 Manager",                      workers: 2, timeout: 18 }
          - { name: trading,    grep: "9\\. Trading metrics",                  workers: 1, timeout: 14 }
          - { name: scheduler,  grep: "10\\. MT5 Background Scheduler",        workers: 2, timeout: 18 }
          - { name: audit,      grep: "11\\. Purchase label & audit trail",    workers: 2, timeout: 18 }
          - { name: settings,   grep: "12\\. Admin Settings",                  workers: 1, timeout: 14 }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run e2e chunk (${{ matrix.name }})
        run: bunx playwright test --grep "${{ matrix.grep }}" --workers=${{ matrix.workers }}
        env:
          CI: "1"
          # Keep the webServer log noise out of the job summary.
          PLAYWRIGHT_HTML_OPEN: never

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.name }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # ─── Secrets guard ───────────────────────────────────────────────────────
  # Fails the workflow if real payment/email gateway secrets (Flutterwave
  # FLWSECK-* values, Resend re_* keys, or hardcoded FLW_SECRET_KEY / 
  # RESEND_API_KEY assignments) are committed. Runs in seconds with no deps
  # (plain bash + grep) and is independent of the Playwright matrix.
  secrets-scan:
    name: secrets-scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan for committed gateway secrets
        run: bash scripts/check-secrets.sh

      - name: Fixture regression guard (both gates)
        run: bash scripts/gitleaks-fixture.sh
