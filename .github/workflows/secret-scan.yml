name: Secret Scan

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      # Regression guard for .gitleaks.toml: seed a fixture covering every
      # custom rule and assert all nine fire (and placeholders don't). Needs
      # the gitleaks binary, which the action above does not leave on PATH.
      # Pinned to the version verified locally for this config.
      - name: Fixture regression guard (both gates)
        run: |
          curl -sL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          GITLEAKS_BIN=/tmp/gitleaks bash scripts/gitleaks-fixture.sh
